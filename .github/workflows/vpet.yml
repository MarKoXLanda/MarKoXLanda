name: VPet

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  push:
    branches: [main]
    paths-ignore: ["assets/vpet.svg", "pet/state.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar mascota
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python pet/generate.py
      - name: Guardar cambios
        run: |
          git config user.name "vpet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vpet.svg pet/state.json
          git diff --cached --quiet || git commit -m "vpet: actualizar estado"
          git push
